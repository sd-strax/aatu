# Example write-side (action) tenant config (design/08 §4) for the bundled
# lateral-movement-via-rdp fixture scenario. Can be its own file or merged into
# the capability config (unknown keys are ignored). The fixture write adapter is
# the "fake Tines" that exercises request → authorize → dispatch → result → reverse
# without a real tool (08 §9); real vendor write adapters land in Phase F.

action_adapters:
  fixture_write:
    class: fixture
    enabled: true
    scenario: lateral-movement-via-rdp

action_bindings:
  host.isolate:
    - action_type: host.isolate
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        device_id: "${target.resolved_identifier}"

  account.disable:
    - action_type: account.disable
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        account: "${target.resolved_identifier}"

  # Reversal pair of account.disable — retract over-containment once the
  # account is cleared (D3FEND Restore: D3-ULA Unlock Account).
  account.enable:
    - action_type: account.enable
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        account: "${target.resolved_identifier}"

  # Block the C2 IOC (IP/domain/hash) at the perimeter — the "fake Tines" accepts
  # any indicator so the containment flow (block 185.220.101.5 / exfil.example.net)
  # completes end-to-end in the demo.
  ioc.block:
    - action_type: ioc.block
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        indicator: "${target.resolved_identifier}"

  # Remove an indicator from the denylist — a standalone action, not a tracked
  # reversal of ioc.block (the block record stays SUCCEEDED; see 04 §7).
  ioc.unblock:
    - action_type: ioc.unblock
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        indicator: "${target.resolved_identifier}"

  # Ticketing family — the operational-handoff vehicle (04 §2.2 Handoff): "hand
  # off the reimage of WIN-FILE01 to IT" completes end-to-end in the demo. The
  # fixture write adapter is the "fake SoR". create targets the destination
  # queue; comment/transition/close target the ticket id.
  ticket.create:
    - action_type: ticket.create
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        project: "${target.resolved_identifier}"

  ticket.comment:
    - action_type: ticket.comment
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        ticket: "${target.resolved_identifier}"

  ticket.transition:
    - action_type: ticket.transition
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        ticket: "${target.resolved_identifier}"

  ticket.close:
    - action_type: ticket.close
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        ticket: "${target.resolved_identifier}"

  # Comms family (Phase F, binding §4) — the "fake Slack/SMTP". An outbound
  # message is a T2 x-action; the pre-send preview is its approval surface.
  # On SUCCEEDED the result path opens/extends the comms thread (comms/).
  notify.slack:
    - action_type: notify.slack
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        channel: "${target.resolved_identifier}"
        message: "${parameters.message}"

  notify.email:
    - action_type: notify.email
      adapter: fixture_write
      operation: dispatch
      priority: 100
      params:
        recipient: "${target.resolved_identifier}"
        subject: "${parameters.subject}"
        body: "${parameters.body}"
